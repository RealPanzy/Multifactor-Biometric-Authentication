<h2>Admin Panel</h2>

<table border="1">

<tr>
<th>User</th>
<th>Status</th>
<th>Action</th>
</tr>

{% for user in users %}

<tr>

<td>{{ user.username }}</td>

<td>

{% if user.approved %}
Approved
{% else %}
Pending
{% endif %}

</td>

<td>

{% if not user.approved %}
<a href="/approve/{{ user.id }}">Approve</a>
{% endif %}

</td>

</tr>

{% endfor %}

</table>

<a href="/dashboard">Back</a>

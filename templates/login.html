<!DOCTYPE html>
<html>

<head>

<title>Nexora Employee Login</title>
<link rel="stylesheet" href="/static/css/style.css">

<style>

body {
  background: #f0f2f5;
  display: flex;
  justify-content: center;
  align-items: center;
  min-height: 100vh;
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
}

.login-box{
width:420px;
background: white;
padding:50px;
border-radius:8px;
box-shadow: 0 2px 8px rgba(0,0,0,0.1);
text-align:center;
position: relative;
overflow: hidden;
}

.login-box:before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: #667eea;
}

.login-header {
  margin-bottom: 30px;
}

.login-header h2{
  color: #667eea;
  margin: 0;
  font-size: 28px;
  margin-bottom: 10px;
}

.login-header p {
  color: #999;
  font-size: 14px;
  margin: 0;
}

.form-group {
  margin: 20px 0;
}

input{
width:100%;
padding:14px 16px;
margin:0;
border: 2px solid #e0e0e0;
border-radius:10px;
font-size: 16px;
transition: all 0.3s;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
box-sizing: border-box;
}

input:focus {
  outline: none;
  border-color: #667eea;
  box-shadow: 0 0 15px rgba(102, 126, 234, 0.2);
}

input::placeholder {
  color: #bbb;
}

.video-container {
  margin: 25px 0;
}
width:100%;
height:auto;
border-radius:8px;
border: 1px solid #ddd;
}

.button-group {
}

button{
margin-top:25px;
padding:12px;
width:100%;
background: #667eea;
border:none;
color:white;
font-size:16px;
font-weight: bold;
cursor:pointer;
border-radius:6px;
transition: background 0.3s;
}

button:hover{
background: #5568d3;
}

button:active {
  opacity: 0.9;
}

#status{
margin-top:20px;
font-weight:bold;
min-height: 20px;
}

.status-success {
  color: #00b894;
}

.status-error {
  color: #ff6b6b;
}

.status-loading {
  color: #667eea;
}

.login-footer {
  margin-top: 25px;
  padding-top: 20px;
  border-top: 1px solid #e0e0e0;
}

.login-footer a{
  color:#667eea;
  text-decoration: none;
  font-weight: 600;
  transition: all 0.3s;
}

.login-footer a:hover {
  color: #764ba2;
  text-decoration: underline;
}

.toggle-password {
  position: absolute;
  right: 0;
  top: 0;
  bottom: 0;
  cursor: pointer;
  padding: 0 10px;
  display: flex;
  align-items: center;
  color: #667eea;
  font-size: 14px;
  font-weight: bold;
}

</style>

</head>

<body>

<div class="login-box">

<div class="login-header">
<h2>Employee Authentication</h2>
<p>Biometric Multi-Factor Login</p>
</div>

<div class="form-group">
<input id="username" placeholder="Employee ID or Username">
</div>

<div class="form-group">
<input id="password" type="password" placeholder="Password">
</div>

<div class="video-container">
<h3 style="color: #667eea; margin-bottom: 10px;">Facial Recognition Capture</h3>
<video id="video" width="100%" autoplay></video>
<canvas id="canvas" width="320" height="240" style="display:none"></canvas>
</div>

<div class="button-group">
<button onclick="loginUser()">Authenticate</button>
</div>

<p id="status"></p>

<div class="login-footer">
<p>Don't have an account? <a href="/register">Create employee account</a></p>
<p style="font-size: 12px; color: #999; margin: 10px 0 0 0;">Enable camera access for facial recognition</p>
</div>

</div>

<script>

const video = document.getElementById("video")
const canvas = document.getElementById("canvas")
const status = document.getElementById("status")

navigator.mediaDevices.getUserMedia({video:true})
.then(stream=>{
  video.srcObject = stream
})
.catch(err => {
  status.innerText = "Camera access denied. Please enable camera permissions."
  status.className = "status-error"
})

async function loginUser(){

const username = document.getElementById("username").value
const password = document.getElementById("password").value

if(!username || !password){
  status.innerText = "Please enter both username and password"
  status.className = "status-error"
  return
}

const ctx = canvas.getContext("2d")
ctx.drawImage(video,0,0,320,240)

const image = canvas.toDataURL("image/jpeg")

status.innerText = "Authenticating..."
status.className = "status-loading"

try{

const res = await fetch("/realtime_login",{
method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({
username:username,
password:password,
image:image
})
})

const data = await res.json()

if(data.status === "success"){

status.innerText="Login successful! Redirecting..."
status.className = "status-success"

setTimeout(() => {
  window.location.href="/portal"
}, 800)

}
else if(data.status === "admin"){

status.innerText="Admin login successful! Redirecting..."
status.className = "status-success"

setTimeout(() => {
  window.location.href="/admin"
}, 800)

}
else{

status.innerText="Authentication failed: " + data.message
status.className = "status-error"

}

}
catch(err){

status.innerText="Server error. Please try again."
status.className = "status-error"

}

}

</script>

</body>

</html>
